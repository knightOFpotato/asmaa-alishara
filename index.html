<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>رحلة أسماء الإشارة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--ink:#2b3a67;--card:#fffdf4;--sky1:#8fd3ff;--sky2:#d8f3ff;--wood:#c98b4b;--wood2:#a06a32;--ok:#2fb344;--btn:#ff9f1c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#22305c;--card:#fffdf4}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:"Cairo","Segoe UI",Tahoma,sans-serif;color:var(--ink);background:linear-gradient(var(--sky1),var(--sky2) 60%,#bff0a8 60%);background-attachment:fixed}
body{position:relative;overflow-x:hidden;min-height:100vh}
.cloud{position:fixed;width:140px;height:44px;background:#fff;border-radius:50px;opacity:.9;animation:drift 40s linear infinite;z-index:0}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:60px;height:60px;top:-28px;left:22px}.cloud:after{width:46px;height:46px;top:-18px;left:70px}
.c1{top:7%;left:-160px}.c2{top:20%;left:-160px;animation-delay:-18s;transform:scale(.7)}
@keyframes drift{to{transform:translateX(130vw)}}
.grass{position:fixed;bottom:0;left:0;right:0;height:16vh;background:#6cc24a;border-top:8px solid #55a83a;z-index:0;text-align:center;font-size:clamp(22px,4vw,36px);overflow:hidden;letter-spacing:6px;line-height:1.6;white-space:nowrap}
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:14px 14px 22vh}
.screen{display:none}.screen.on{display:block;animation:pop .4s}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.card{background:var(--card);border:5px solid #ffd23f;border-radius:28px;padding:22px 18px;text-align:center;box-shadow:0 8px 0 rgba(0,0,0,.1)}
h1{font-size:clamp(28px,6vw,46px);font-weight:900;margin:8px 0}
p.lead{font-size:clamp(18px,3.6vw,26px);font-weight:600;margin:8px 0 18px}
.kid{font-size:clamp(80px,18vw,130px);line-height:1;display:inline-block;animation:wave 2s ease-in-out infinite;transform-origin:bottom}
@keyframes wave{50%{transform:rotate(-6deg) translateY(-6px)}}
.btn{font-family:inherit;font-size:clamp(22px,5vw,32px);font-weight:900;color:#fff;background:var(--btn);border:0;border-radius:60px;padding:12px 44px;cursor:pointer;box-shadow:0 7px 0 #c97800;transition:transform .1s}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #c97800}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
.score{background:var(--card);border:4px solid #4cc9f0;border-radius:20px;padding:6px 16px;font-weight:900;font-size:clamp(18px,4vw,26px);white-space:nowrap}
.q{flex:1;background:var(--card);border:4px solid #ffd23f;border-radius:20px;padding:8px 14px;font-weight:800;font-size:clamp(16px,3.6vw,24px);text-align:center}
.boards{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:18px 0}
.board{text-align:center}
.sign{background:linear-gradient(var(--wood),var(--wood2));color:#fff;font-weight:900;font-size:clamp(30px,8vw,52px);border-radius:16px;padding:4px 0;border:4px solid #7b4d1f;text-shadow:0 3px 0 rgba(0,0,0,.25);position:relative}
.sign:before,.sign:after{content:"";position:absolute;bottom:-26px;width:12px;height:26px;background:#7b4d1f}
.sign:before{right:20%}.sign:after{left:20%}
.zone{margin-top:26px;min-height:clamp(110px,24vw,160px);border:5px dashed #fff;background:rgba(255,255,255,.55);border-radius:22px;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;padding:8px;transition:.15s}
.zone.hot{background:rgba(255,235,120,.8);transform:scale(1.03)}
.zone.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.placed{position:relative;text-align:center;font-weight:800;font-size:clamp(16px,3.5vw,22px);animation:pop .4s}
.placed .em{font-size:clamp(46px,11vw,70px);display:block;line-height:1.1}
.tick{position:absolute;top:-6px;right:-8px;background:var(--ok);color:#fff;border-radius:50%;width:30px;height:30px;font-size:20px;line-height:30px}
.tray{display:flex;justify-content:center;gap:clamp(8px,3vw,22px);flex-wrap:wrap;background:rgba(255,255,255,.7);border-radius:26px;padding:14px;min-height:130px}
.item{touch-action:none;user-select:none;cursor:grab;text-align:center;background:var(--card);border:4px solid #ffd23f;border-radius:20px;padding:8px 10px;width:clamp(72px,20vw,110px);font-weight:800;font-size:clamp(15px,3.4vw,20px);transition:transform .15s}
.item:hover{transform:translateY(-4px) rotate(-3deg)}
.item .em{font-size:clamp(42px,11vw,64px);display:block;line-height:1.1}
.item.used{display:none}
.ghost{position:fixed;z-index:50;pointer-events:none;transform:translate(-50%,-50%) scale(1.15) rotate(6deg);opacity:.95;filter:drop-shadow(0 10px 8px rgba(0,0,0,.25))}
.msg{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(0);background:var(--card);border:5px solid #ffd23f;border-radius:24px;padding:12px 26px;font-weight:900;font-size:clamp(22px,6vw,34px);z-index:60;pointer-events:none;transition:transform .25s;white-space:nowrap}
.msg.show{transform:translate(-50%,-50%) scale(1)}
.msg.good{border-color:var(--ok);color:var(--ok)}
.big{font-size:clamp(54px,14vw,90px);font-weight:900;color:var(--ok);margin:6px 0}
.stars{font-size:clamp(34px,9vw,54px)}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="grass" aria-hidden="true">🌼🌷🌱🌻🌿🌸🌱🌼🌷🌿🌻🌸🌱🌼🌷🌿🌻🌸</div>
<div class="msg" id="msg"></div>
<main>
  <section class="screen on" id="start">
    <div class="card">
      <div class="kid">🧒</div>
      <h1>مرحباً يا أبطال اللغة العربية!</h1>
      <p class="lead">هيا نتعلم أسماء الإشارة ونساعد الطفل على وضع الصور في المكان الصحيح.</p>
      <button class="btn" id="go">ابدأ اللعبة</button>
    </div>
  </section>

  <section class="screen" id="game">
    <div class="top">
      <div class="score">⭐ الدرجة: <span id="sc">0</span> / 8</div>
      <div class="q">🧒 ضع الصور في المكان المناسب، واختر اسم الإشارة الصحيح.</div>
    </div>
    <div class="boards">
      <div class="board"><div class="sign">هذا</div><div class="zone" id="z-هذا" data-a="هذا"></div></div>
      <div class="board"><div class="sign">هذه</div><div class="zone" id="z-هذه" data-a="هذه"></div></div>
    </div>
    <div class="tray" id="tray"></div>
  </section>

  <section class="screen" id="result">
    <div class="card">
      <div class="kid">🧒</div>
      <h1>أحسنت يا بطل!</h1>
      <div class="stars" id="stars"></div>
      <div class="big"><span id="fin">0</span> / 8</div>
      <p class="lead">عدد الإجابات الصحيحة: <b id="cor">0</b> من 4</p>
      <p class="lead" id="note"></p>
      <button class="btn" id="again">أعد اللعب</button>
    </div>
  </section>
</main>

<script>
const ITEMS=[
 {id:'apple',e:'🍎',n:'تفاحة',a:'هذه'},
 {id:'flower',e:'🌸',n:'زهرة',a:'هذه'},
 {id:'book',e:'📖',n:'كتاب',a:'هذا'},
 {id:'cat',e:'🐱',n:'قط',a:'هذا'}
];
const $=s=>document.querySelector(s);
let score=0,done=new Set(),ac=null;

function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0)}
function tone(freqs,type='sine',dur=.15,vol=.15){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    freqs.forEach((f,i)=>{
      const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+i*dur;
      o.type=type;o.frequency.value=f;g.gain.setValueAtTime(vol,t);
      g.gain.exponentialRampToValueAtTime(.001,t+dur*1.6);
      o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur*1.7);
    });
  }catch(e){}
}
let mt;
function say(t,good){
  const m=$('#msg');m.textContent=t;m.className='msg show'+(good?' good':'');
  clearTimeout(mt);mt=setTimeout(()=>m.classList.remove('show'),1100);
}
function mk(it,cls){
  const d=document.createElement('div');d.className=cls;
  d.innerHTML='<span class="em">'+it.e+'</span>'+it.n;return d;
}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function reset(){
  score=0;done.clear();$('#sc').textContent=0;
  document.querySelectorAll('.zone').forEach(z=>z.innerHTML='');
  const tray=$('#tray');tray.innerHTML='';
  shuffle(ITEMS).forEach(it=>{
    const el=mk(it,'item');el.dataset.id=it.id;
    el.addEventListener('pointerdown',e=>drag(e,el,it));
    tray.appendChild(el);
  });
}

function drag(e,el,it){
  if(done.has(it.id))return;
  e.preventDefault();
  const g=mk(it,'item ghost');document.body.appendChild(g);
  el.style.opacity=.3;
  const move=(x,y)=>{
    g.style.left=x+'px';g.style.top=y+'px';
    document.querySelectorAll('.zone').forEach(z=>{
      const r=z.getBoundingClientRect();
      z.classList.toggle('hot',x>r.left&&x<r.right&&y>r.top&&y<r.bottom);
    });
  };
  move(e.clientX,e.clientY);
  const mv=ev=>move(ev.clientX,ev.clientY);
  const up=ev=>{
    window.removeEventListener('pointermove',mv);
    window.removeEventListener('pointerup',up);
    window.removeEventListener('pointercancel',up);
    g.remove();el.style.opacity=1;
    let target=null;
    document.querySelectorAll('.zone').forEach(z=>{
      const r=z.getBoundingClientRect();
      if(ev.clientX>r.left&&ev.clientX<r.right&&ev.clientY>r.top&&ev.clientY<r.bottom)target=z;
      z.classList.remove('hot');
    });
    if(target)drop(target,it,el);
  };
  window.addEventListener('pointermove',mv);
  window.addEventListener('pointerup',up);
  window.addEventListener('pointercancel',up);
}

function drop(zone,it,el){
  if(done.has(it.id))return;
  if(zone.dataset.a===it.a){
    done.add(it.id);score+=2;$('#sc').textContent=score;
    el.classList.add('used');
    const p=mk(it,'placed');p.insertAdjacentHTML('beforeend','<span class="tick">✓</span>');
    zone.appendChild(p);
    tone([523,659,784,1047],'triangle');
    say('✅ أحسنت!',true);
    if(done.size===ITEMS.length)setTimeout(finish,1300);
  }else{
    zone.classList.remove('shake');void zone.offsetWidth;zone.classList.add('shake');
    tone([300,260],'sine',.18,.1);
    say('حاول مرة أخرى!');
  }
}

function finish(){
  if(done.size<ITEMS.length)return;
  $('#fin').textContent=score;$('#cor').textContent=done.size;
  const stars=score>=8?3:score>=6?2:1;
  $('#stars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
  $('#note').textContent=score>=8?'ممتاز! أنت بطل أسماء الإشارة!':score>=6?'رائع! استمر وستصبح بطلاً!':'جميل! العب مرة أخرى لتتعلم أكثر.';
  tone([523,659,784,1047,1319],'triangle',.12);
  show('result');
}

$('#go').onclick=()=>{try{ac=ac||new (window.AudioContext||window.webkitAudioContext)()}catch(e){}reset();show('game')};
$('#again').onclick=()=>{reset();show('game')};
</script>
</body>
  </html>
